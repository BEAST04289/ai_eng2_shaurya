<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kestrel Returns Risk</title>
  <style>
    body{font-family:Inter,system-ui,sans-serif;max-width:980px;margin:36px auto;padding:0 20px;background:#f6f7f9;color:#15171a}
    .card{background:white;border:1px solid #e2e5e9;border-radius:14px;padding:22px;margin-bottom:18px}
    textarea{width:100%;min-height:330px;font-family:ui-monospace,monospace;font-size:13px;padding:12px;box-sizing:border-box}
    button{padding:11px 18px;border:0;border-radius:9px;background:#111;color:#fff;font-weight:650;cursor:pointer}
    pre{white-space:pre-wrap;background:#111;color:#eee;padding:16px;border-radius:10px;min-height:100px}
    .small{color:#5d6570;font-size:14px}
  </style>
</head>
<body>
  <h1>Kestrel Returns Risk</h1>
  <p class="small">Pre-dispatch risk scoring. High-risk orders are routed to a confirmation call, not automatically held.</p>
  <div class="card">
    <h3>Single order JSON</h3>
    <textarea id="payload">{
  "order_id": "DEMO-ORDER-001",
  "order_placed_at": "2026-07-01 10:00",
  "customer_id": "DEMO-CUSTOMER-001",
  "sku": "DEMO-SKU-001",
  "sales_channel": "web",
  "payment_mode": "cod",
  "discount_pct": 20,
  "qty": 1,
  "order_value_inr": 4159.2,
  "promised_delivery_days": 7,
  "delivery_pincode": "560001",
  "is_gift": "N",
  "customer_prior_orders": 2,
  "customer_prior_returns": 1,
  "delivery_note": "Call before delivery",
  "last_service_event_type": "NONE",
  "pickup_scheduled_at": null,
  "source": "crm"
}</textarea><br><br>
    <button onclick="scoreOrder()">Score order</button>
  </div>
  <div class="card">
    <h3>Result</h3>
    <pre id="result">Waiting for an order.</pre>
  </div>
<script>
async function scoreOrder(){
  const out=document.getElementById('result');
  try{
    const body=JSON.parse(document.getElementById('payload').value);
    const r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data=await r.json();
    out.textContent=JSON.stringify(data,null,2);
  }catch(e){out.textContent=String(e)}
}
</script>
</body>
</html>
